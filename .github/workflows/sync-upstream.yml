name: Sync with Upstream

on:
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight UTC
  workflow_dispatch:      # Manual trigger

permissions:
  contents: write

jobs:
  sync:
    name: Sync with Upstream
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "Sam Pangilinan"
          git config user.email "sam@zeticuz.xyz"

      - name: Add Upstream Remote
        run: |
          git remote add upstream https://github.com/storytold/vectorcraft.git || true
          git fetch upstream master || git fetch upstream main || true

      - name: Sync Master / Main Branch
        run: |
          UPSTREAM_BRANCH="master"
          if ! git show-ref --verify --quiet refs/remotes/upstream/master; then
            UPSTREAM_BRANCH="main"
          fi
          echo "Merging upstream/$UPSTREAM_BRANCH into current branch..."
          git merge upstream/$UPSTREAM_BRANCH --no-edit -m "chore(sync): sync with upstream $UPSTREAM_BRANCH" || true
          git push origin HEAD || echo "Push skipped or conflicts need manual resolution"
